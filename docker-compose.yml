services:
    jagakucing-app:
        build:
            context: .
            dockerfile: docker/DockerFile
        image: jagakucing-app:latest
        container_name: "jagakucing-app"
        platform: linux/amd64
        networks:
            - app-network
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - 5180:5180
        volumes:
            - ".:/var/www/html"
            - "./docker/php.ini:/usr/local/etc/php/conf.d/php.ini"
    nginx:
        image: nginx:alpine
        container_name: jagakucing-nginx
        platform: linux/amd64
        restart: unless-stopped
        ports:
            - 8010:80
        working_dir: "/var/www/html"
        volumes:
            - ".:/var/www/html"
            - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf"
        networks:
            - app-network
        depends_on:
            - jagakucing-app
    postgres:
        image: postgres:16.2-alpine
        container_name: jagakucing-postgres
        platform: linux/amd64
        restart: unless-stopped
        environment:
            POSTGRES_ROOT_PASSWORD: "${DB_PASSWORD}"
            POSTGRES_DATABASE: "${DB_DATABASE}"
            POSTGRES_USER: "${DB_USERNAME}"
            POSTGRES_PASSWORD: "${DB_PASSWORD}"
        ports:
            - 3320:5432
        volumes:
            - "vol-jagakucing-postgres:/var/lib/postgresql/data"
        networks:
            - app-network
    redis:
        image: redis:8.0-alpine
        container_name: jagakucing-redis
        platform: linux/amd64
        restart: unless-stopped
        environment:
            - ALLOW_EMPTY_PASSWORD=yes
        ports:
            - "6390:6379"
        networks:
            - app-network
    mailpit:
        image: axllent/mailpit:latest
        container_name: jagakucing-mailpit
        platform: linux/amd64
        ports:
            - 1040:1025
            - 8040:8025
        networks:
            - app-network
    
networks:
    app-network:
        driver: bridge
        ipam:
            config:
                - subnet: 192.168.113.0/24
volumes:
    vol-jagakucing-postgres:
        driver: local